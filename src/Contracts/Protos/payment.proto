syntax = "proto3";

option csharp_namespace = "HotelBooking.Contracts.Payment";

package payment;

service Payments {
  // Idempotent per booking: calling again returns the same checkout URL.
  rpc CreateCheckoutSession (CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse);
}

message CreateCheckoutSessionRequest {
  string booking_id = 1;
  int64 amount_cents = 2;
  // Shown to the customer on the Stripe checkout page.
  string description = 3;
  string customer_email = 4;
}

message CreateCheckoutSessionResponse {
  string checkout_url = 1;
}
