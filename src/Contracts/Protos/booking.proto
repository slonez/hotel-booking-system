syntax = "proto3";

option csharp_namespace = "HotelBooking.Contracts.Booking";

package booking;

import "google/protobuf/timestamp.proto";

service Bookings {
  rpc SearchAvailability (SearchAvailabilityRequest) returns (SearchAvailabilityResponse);
  rpc CreateBooking (CreateBookingRequest) returns (CreateBookingResponse);
  rpc ListBookings (ListBookingsRequest) returns (ListBookingsResponse);
  rpc CancelBooking (CancelBookingRequest) returns (CancelBookingResponse);
}

message SearchAvailabilityRequest {
  string city = 1;
  // Dates are ISO 8601 (yyyy-MM-dd).
  string check_in_date = 2;
  string check_out_date = 3;
}

message SearchAvailabilityResponse {
  repeated RoomTypeAvailability room_types = 1;
}

message RoomTypeAvailability {
  int32 hotel_id = 1;
  string hotel_name = 2;
  int32 room_type_id = 3;
  string room_type_name = 4;
  // Amounts are in cents (EUR), same as Stripe.
  int64 price_per_night_cents = 5;
  int64 total_price_cents = 6;
  int32 available_rooms = 7;
}

message CreateBookingRequest {
  int32 room_type_id = 1;
  string check_in_date = 2;
  string check_out_date = 3;
  // Taken from the JWT by the Gateway.
  string clerk_user_id = 4;
  string email = 5;
}

message CreateBookingResponse {
  string booking_id = 1;
  int64 total_price_cents = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message ListBookingsRequest {
  string clerk_user_id = 1;
}

message ListBookingsResponse {
  repeated BookingSummary bookings = 1;
}

message BookingSummary {
  string booking_id = 1;
  string hotel_name = 2;
  string room_type_name = 3;
  string check_in_date = 4;
  string check_out_date = 5;
  // Held, Confirmed, Expired or Cancelled.
  string status = 6;
  int64 total_price_cents = 7;
  google.protobuf.Timestamp expires_at = 8;
  // Set only for cancelled bookings.
  optional int64 refund_amount_cents = 9;
}

message CancelBookingRequest {
  string booking_id = 1;
  string clerk_user_id = 2;
}

message CancelBookingResponse {
  int64 refund_amount_cents = 1;
}
