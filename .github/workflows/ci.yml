name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build
      # Integration tests start their own containers with Testcontainers; the runner has Docker.
      - run: dotnet test --no-build

  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check Prometheus config and test alert rules
        run: |
          docker run --rm -v "$PWD/docker/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/docker/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.15.1 test rules /etc/prometheus/alerts.test.yml
      - name: Check Alertmanager config
        run: docker run --rm -v "$PWD/docker/alertmanager:/etc/alertmanager:ro" --entrypoint amtool prom/alertmanager:v0.34.2 check-config /etc/alertmanager/alertmanager.yml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
