global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:5172"]
  - job_name: booking
    static_configs:
      - targets: ["booking:5233"]
  - job_name: payment
    static_configs:
      - targets: ["payment:5243"]
  - job_name: notification
    static_configs:
      - targets: ["notification:5252"]
  - job_name: rabbitmq
    # The default endpoint sums over queues; alerts need the count of each queue.
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
