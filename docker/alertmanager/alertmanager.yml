global:
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@hotel-booking.example
  smtp_require_tls: false

route:
  receiver: ops
  group_by: [alertname]
  group_wait: 10s
  repeat_interval: 4h

receivers:
  - name: ops
    email_configs:
      - to: ops@hotel-booking.example
        send_resolved: true
